name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *" # daily: catch upstream data.gov.sg contract drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt / validate / test / lint / scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate + test root (mocked AWS provider, no credentials)
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test
      - name: validate bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra/terraform --recursive
      - name: checkov (hard fail; reviewed skips in .checkov.yaml)
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml

  unit:
    name: Unit tests (pipeline scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit

  contract:
    name: data.gov.sg contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:contract
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}

  rules:
    name: Business-rule tests (Resale_CS rules API on Dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:rules
        env:
          HOMESCOPE_URL: ${{ vars.HOMESCOPE_URL || 'https://personal-ljonxgvs.outsystemscloud.com/HomeScope/' }}

  e2e:
    # Independent of the upstream contract: a data.gov.sg outage must not hide UI regressions.
    name: End-to-end (Playwright) against Dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          HOMESCOPE_URL: ${{ vars.HOMESCOPE_URL || 'https://personal-ljonxgvs.outsystemscloud.com/HomeScope/' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14
